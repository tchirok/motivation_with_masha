<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7e4eb">
  <title>Каждый день — маленький шаг</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #3b2140;
      --muted: #806d83;
      --pink: #e83c78;
      --pink-dark: #c92361;
      --pink-soft: #f9e5ed;
      --plum: #8c64c4;
      --green: #299a83;
      --gold: #e1a53c;
      --paper: rgba(255, 253, 253, .96);
      --line: #f0e4eb;
      --shadow: 0 14px 34px rgba(92, 40, 75, .09);
      --radius: 20px;
      font-family: Inter, ui-rounded, "Avenir Next", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 0%, rgba(255,255,255,.65), transparent 34rem),
        radial-gradient(ellipse at 98% 42%, rgba(255,255,255,.45), transparent 30rem),
        linear-gradient(155deg, #f8e1ea 0%, #f5e7f3 48%, #fae5db 100%);
      background-attachment: fixed;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #b794e4; outline-offset: 2px; }
    .app { max-width: 1240px; width: min(100% - 36px, 1240px); margin: 0 auto; padding: 30px 0 56px; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:12px; }
    .eyebrow { color:var(--pink-dark); font-weight:850; font-size:.78rem; letter-spacing:.11em; text-transform:uppercase; }
    .save-state { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.77); color:var(--muted); padding:9px 13px; border-radius:999px; font-size:.82rem; }
    .save-dot { width:8px; height:8px; border-radius:50%; background:#47b49c; box-shadow:0 0 0 3px #dcf3ed; }
    h1 { margin:0; font-size:clamp(2rem, 5vw, 3.55rem); line-height:1; letter-spacing:-.055em; font-weight:950; }
    h1 .accent { color:var(--pink); }
    .subtitle { margin:10px 0 22px; color:var(--muted); font-size:.96rem; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
    .pill, .target-control { display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1px solid rgba(255,255,255,.9); border-radius:999px; padding:9px 14px; box-shadow:0 4px 14px rgba(92,40,75,.04); color:var(--muted); font-size:.84rem; }
    .target-control input { width:46px; border:0; border-bottom:1px solid var(--gold); background:transparent; text-align:center; font-weight:800; color:var(--ink); padding:2px; }
    .quiet-button, .nav-tab, .mode-tab, .range-button, .calendar-nav, .text-button, .add-task, .remove-task, .date-chip, .today-button {
      border:0; cursor:pointer;
    }
    .quiet-button, .today-button { border-radius:999px; background:white; color:var(--muted); padding:10px 15px; box-shadow:0 5px 14px rgba(92,40,75,.06); font-size:.85rem; }
    .quiet-button:hover, .today-button:hover { color:var(--pink-dark); transform:translateY(-1px); }
    .profile-tabs { display:flex; gap:8px; overflow-x:auto; padding:3px 1px 11px; scrollbar-width:thin; }
    .nav-tab { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:10px 15px 10px 10px; border-radius:999px; background:rgba(255,255,255,.82); box-shadow:0 5px 15px rgba(86,40,73,.06); font-weight:750; color:var(--ink); transition:.18s ease; }
    .nav-tab:hover { transform:translateY(-2px); }
    .nav-tab.active { background:var(--avatar-color,var(--pink)); color:white; box-shadow:0 8px 18px rgba(130,84,171,.20); }
    .avatar { width:31px; height:31px; display:grid; place-items:center; border-radius:50%; background:var(--avatar-color,linear-gradient(145deg,#f6a8c3,#c989d1)); color:white; font-weight:900; }
    .nav-tab.active .avatar { background:rgba(255,255,255,.26); }
    .tab-name { display:block; font-size:.87rem; }
    .tab-meta { display:block; font-size:.7rem; opacity:.78; font-weight:650; }
    .modebar { display:flex; width:max-content; max-width:100%; background:rgba(255,255,255,.84); padding:5px; border-radius:999px; margin:3px 0 18px; box-shadow:0 6px 18px rgba(86,40,73,.06); }
    .mode-tab { padding:10px 19px; border-radius:999px; background:transparent; color:var(--muted); font-weight:850; font-size:.85rem; }
    .mode-tab.active { background:linear-gradient(115deg,var(--pink),var(--plum)); color:white; box-shadow:0 4px 10px rgba(130,84,171,.2); }
    .panel { background:var(--paper); border:1px solid rgba(255,255,255,.92); border-radius:var(--radius); box-shadow:var(--shadow); }
    .summary { padding:20px 24px; display:flex; align-items:center; gap:20px; margin-bottom:15px; }
    .ring { width:76px; height:76px; flex:0 0 76px; border-radius:50%; display:grid; place-items:center; position:relative; background:conic-gradient(var(--ring-color,var(--pink)) var(--progress,0%), #f5dfe9 0); }
    .ring::before { content:""; position:absolute; inset:7px; border-radius:50%; background:white; }
    .ring-content { position:relative; text-align:center; line-height:1.05; }
    .ring strong { display:block; font-size:1.08rem; }
    .ring span { display:block; margin-top:4px; color:var(--muted); font-size:.62rem; }
    .summary h2 { margin:0 0 5px; font-size:1.06rem; letter-spacing:-.02em; }
    .summary p { margin:0; color:var(--muted); font-size:.83rem; }
    .summary-right { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .summary-stat { min-width:90px; border-left:1px solid var(--line); padding-left:14px; }
    .summary-stat strong { display:block; font-size:1.08rem; color:var(--pink-dark); }
    .summary-stat span { display:block; font-size:.72rem; color:var(--muted); margin-top:3px; }
    .section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin:23px 2px 12px; }
    .section-head h2 { margin:0; font-size:1.12rem; letter-spacing:-.025em; }
    .section-head p { margin:5px 0 0; color:var(--muted); font-size:.82rem; }
    .calendar-panel { padding:20px; margin-bottom:17px; }
    .calendar-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .calendar-title { display:flex; align-items:center; gap:10px; }
    .calendar-title h2 { margin:0; font-size:1.08rem; text-transform:capitalize; }
    .calendar-title .month-sprig { font-size:1.15rem; }
    .calendar-actions { display:flex; gap:8px; align-items:center; }
    .calendar-nav { width:35px; height:35px; border-radius:50%; background:#f8edf2; color:var(--ink); font-size:1.1rem; }
    .calendar-nav:hover:not(:disabled) { background:var(--pink-soft); color:var(--pink-dark); }
    .calendar-nav:disabled { opacity:.35; cursor:not-allowed; }
    .today-button { padding:8px 12px; font-size:.78rem; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
    .weekday { text-align:center; color:var(--muted); font-size:.7rem; font-weight:850; padding:4px 0 7px; text-transform:uppercase; }
    .day-cell { position:relative; min-height:66px; border:1px solid transparent; border-radius:12px; background:#fffafd; color:var(--ink); padding:7px 8px; text-align:left; cursor:pointer; transition:.15s ease; }
    .day-cell:hover:not(:disabled) { background:#fff1f6; border-color:#f1c9d9; transform:translateY(-1px); }
    .day-cell.selected { background:#f9e4ed; border-color:#e77ba3; box-shadow:inset 0 0 0 1px #e77ba3; }
    .day-cell.today .day-number { color:var(--pink-dark); font-weight:950; }
    .day-cell.outside { visibility:hidden; }
    .day-cell.future { color:#c0b6c1; background:#fcf9fb; cursor:not-allowed; }
    .day-number { display:block; font-size:.84rem; font-weight:750; }
    .day-meta { display:flex; gap:4px; margin-top:8px; align-items:center; min-height:7px; }
    .day-dot { width:6px; height:6px; border-radius:50%; background:var(--pink); }
    .day-dot:nth-child(2) { background:var(--plum); }
    .day-dot:nth-child(3) { background:var(--green); }
    .day-count { color:var(--muted); font-size:.63rem; }
    .selected-day { display:flex; justify-content:space-between; align-items:center; gap:12px; background:#fff8fb; border:1px solid #f5e5eb; padding:12px 14px; border-radius:14px; margin-top:14px; }
    .selected-day strong { font-size:.88rem; }
    .selected-day span { color:var(--muted); font-size:.77rem; }
    .selected-day-label { display:grid; gap:3px; }
    .task-section { margin:0 0 18px; }
    .people-toolbar { display:flex; justify-content:flex-end; margin:-2px 0 13px; }
    .people-manager { padding:18px; margin:0 0 16px; }
    .people-manager h2 { margin:0 0 5px; font-size:1rem; }
    .people-manager p { margin:0 0 14px; color:var(--muted); font-size:.78rem; }
    .people-manager-list { display:grid; gap:8px; }
    .people-manager-row { display:grid; grid-template-columns:minmax(120px,1fr) 48px auto auto; gap:8px; align-items:center; padding:9px 0; border-bottom:1px dashed var(--line); }
    .people-manager-row input[type=text], .people-add-form input[type=text] { min-width:0; width:100%; padding:9px 10px; border:1px solid #ecd9e3; border-radius:10px; background:#fff; color:var(--ink); }
    .people-manager-row input[type=color], .people-add-form input[type=color] { width:42px; height:36px; border:0; background:transparent; padding:2px; cursor:pointer; }
    .people-add-form { display:grid; grid-template-columns:minmax(120px,1fr) 48px auto; gap:8px; align-items:center; margin-top:14px; }
    .people-manager-actions { display:flex; gap:7px; align-items:center; }
    .anti-card { width:min(100%, 760px); padding:17px 19px; margin:0 0 18px; border-left:4px solid #e1a53c; background:linear-gradient(120deg,rgba(255,250,239,.98),rgba(255,253,253,.96)); }
    .anti-card h2 { margin:0 0 6px; font-size:1rem; }
    .anti-card .anti-copy { margin:0 0 12px; color:var(--muted); font-size:.8rem; line-height:1.5; }
    .anti-form { display:flex; flex-wrap:wrap; gap:8px; }
    .anti-form input { flex:1 1 220px; min-width:0; padding:10px 12px; border:1px solid #ecd9e3; border-radius:10px; background:#fff; color:var(--ink); }
    .anti-result { margin:0 !important; padding:10px 12px; background:#fff8e9; border:1px solid #f2e2bd; border-radius:11px; color:var(--ink) !important; font-size:.82rem !important; line-height:1.5; }
    .anti-result strong { color:#986616; }
    .anti-remove { display:inline-flex; margin:9px 0 0; padding:5px 0; border:0; background:transparent; color:#a58d70; font-size:.72rem; cursor:pointer; }
    .anti-remove:hover { color:#9b5a27; }
    .anti-hint { margin-top:8px; color:#9a866c; font-size:.7rem; }
    .task-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .task-card { border-left:4px solid var(--card-color,var(--pink)); padding:16px 16px 14px; min-height:154px; }
    .task-card h3 { margin:0 0 10px; font-size:.98rem; }
    .task-card-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .task-card-head h3 { margin:0; }
    .category-actions { display:flex; gap:3px; }
    .block-action { border:0; background:transparent; color:#a28da2; border-radius:7px; padding:5px 7px; font-size:.76rem; cursor:pointer; }
    .block-action:hover { color:var(--pink-dark); background:#fbedf2; }
    .outline-action { border:1px solid #edd5e1; background:#fff9fc; color:var(--pink-dark); border-radius:999px; padding:8px 12px; font-size:.76rem; font-weight:850; cursor:pointer; white-space:nowrap; }
    .outline-action:hover { background:#f9e4ed; }
    .empty-category { color:var(--muted); font-size:.76rem; padding:6px 0 2px; }
    .task-list { display:grid; gap:0; }
    .task-row { display:grid; grid-template-columns:20px minmax(0,1fr) auto 20px; align-items:start; gap:8px; padding:9px 0; border-bottom:1px dashed #f0e5eb; font-size:.8rem; }
    .task-row:last-child { border-bottom:0; }
    .task-row input[type=checkbox] { width:16px; height:16px; accent-color:var(--pink); margin:1px 0 0; cursor:pointer; }
    .task-title { line-height:1.35; }
    .task-row.done .task-title { color:#9a8a99; text-decoration:line-through; }
    .task-points { white-space:nowrap; color:var(--muted); font-size:.72rem; font-weight:800; }
    .remove-task { width:20px; height:20px; background:transparent; color:#c2a9b7; font-size:.92rem; padding:0; line-height:1; }
    .remove-task:hover { color:var(--pink-dark); }
    .add-task { display:inline-flex; align-items:center; gap:6px; padding:7px 0 0; background:transparent; color:var(--pink-dark); font-size:.78rem; font-weight:850; }
    .add-task:hover { color:#a91c4e; }
    .inline-form { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:9px; }
    .inline-form input { min-width:130px; flex:1; padding:8px 10px; border:1px solid #ecd9e3; border-radius:10px; background:#fff; color:var(--ink); font-size:.77rem; }
    .inline-form input.points-input { min-width:54px; max-width:62px; flex:0; text-align:center; }
    .small-action { border:0; border-radius:9px; padding:8px 11px; background:var(--pink); color:white; font-weight:800; font-size:.76rem; cursor:pointer; }
    .small-action.secondary { background:#f3e8f4; color:var(--ink); }
    .member-block { margin-bottom:17px; }
    .member-title { display:flex; align-items:center; gap:9px; margin:0 0 9px; font-size:.94rem; }
    .member-title .avatar { width:27px; height:27px; font-size:.75rem; }
    .common-task-card { padding:15px 17px; margin-bottom:10px; }
    .common-task { display:grid; grid-template-columns:minmax(170px,1fr) minmax(0,2fr); gap:10px 16px; align-items:center; padding:11px 0; border-bottom:1px dashed #efe3e9; }
    .common-task:last-child { border-bottom:0; }
    .common-task-name { font-size:.82rem; line-height:1.35; }
    .common-task-name strong { display:inline-block; color:var(--pink-dark); margin-left:5px; font-size:.72rem; }
    .checks { display:flex; flex-wrap:wrap; gap:6px; }
    .person-check { display:inline-flex; align-items:center; gap:5px; padding:5px 8px; border-radius:999px; background:#fbf4f7; color:var(--muted); font-size:.7rem; cursor:pointer; }
    .person-check input { accent-color:var(--pink); width:13px; height:13px; margin:0; }
    .person-check.checked { background:#f7dce7; color:var(--pink-dark); font-weight:800; }
    .empty-state { padding:22px; text-align:center; color:var(--muted); }
    .empty-state strong { color:var(--ink); }
    .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:11px; margin-bottom:16px; }
    .personal-metrics { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .metric { padding:17px 18px; min-height:94px; }
    .metric strong { display:block; color:var(--pink-dark); font-size:1.45rem; line-height:1; }
    .metric span { display:block; margin-top:8px; color:var(--muted); font-size:.76rem; }
    .analytics-grid { display:grid; grid-template-columns:1.3fr .9fr; gap:14px; }
    .chart-panel { padding:19px; min-height:255px; }
    .chart-panel h3 { margin:0 0 4px; font-size:.99rem; }
    .chart-panel p { margin:0; color:var(--muted); font-size:.77rem; }
    .range-switch { display:flex; gap:5px; margin:14px 0 10px; }
    .range-button { padding:7px 11px; background:#f7edf2; color:var(--muted); border-radius:999px; font-size:.72rem; font-weight:800; }
    .range-button.active { background:var(--plum); color:white; }
    .bars { display:flex; gap:8px; align-items:end; height:135px; padding:10px 2px 0; border-bottom:1px solid #eadce5; }
    .bar-col { flex:1; min-width:0; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; }
    .bar-value { font-size:.62rem; color:var(--muted); }
    .bar { width:min(72%,34px); min-height:3px; border-radius:7px 7px 2px 2px; background:linear-gradient(180deg,#e873a0,#a779ce); transition:height .2s; }
    .bar-label { color:var(--muted); font-size:.61rem; white-space:nowrap; }
    .team-chart-card { padding:20px 22px 14px; margin-top:12px; }
    .team-chart-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; }
    .team-chart-heading h3 { margin:0 0 5px; font-size:1.02rem; }
    .team-chart-heading p { margin:0; color:var(--muted); font-size:.78rem; }
    .team-chart-total { flex:0 0 auto; padding:8px 12px; border-radius:12px; background:#fff3f7; color:var(--pink-dark); font-weight:900; font-size:.9rem; white-space:nowrap; }
    .team-chart-wrap { width:100%; overflow:hidden; }
    .team-chart-svg { display:block; width:100%; height:auto; min-height:210px; }
    .team-chart-svg text { font-family:inherit; fill:var(--muted); font-size:11px; }
    .team-chart-grid { stroke:#f0e5eb; stroke-width:1; }
    .team-chart-line { fill:none; stroke:#df4a83; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:miter; }
    .team-chart-point { fill:#fff; stroke:#df4a83; stroke-width:2; }
    .team-chart-empty { padding:48px 16px; text-align:center; color:var(--muted); }
    .analytics-footnote { margin:9px 3px 0; color:var(--muted); font-size:.76rem; }
    @media (max-width:560px) {
      .team-chart-card { padding:16px 12px 10px; }
      .team-chart-heading { flex-direction:column; }
      .team-chart-total { font-size:.82rem; }
      .team-chart-svg { min-height:180px; }
    }
    .category-list { display:grid; gap:13px; margin-top:19px; }
    .category-line { display:grid; grid-template-columns:minmax(95px,140px) 1fr 34px; align-items:center; gap:8px; font-size:.75rem; }
    .category-name { color:var(--muted); }
    .category-track { height:9px; background:#f8eaf0; border-radius:999px; overflow:hidden; }
    .category-fill { height:100%; background:linear-gradient(90deg,#e84a82,#a279cf); border-radius:inherit; }
    .category-value { text-align:right; color:var(--muted); font-weight:800; }
    .leaderboard { margin-top:15px; }
    .leader-row { display:grid; grid-template-columns:1fr 1.2fr 46px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #f2e7ec; }
    .leader-row:last-child { border:0; }
    .leader-name { display:flex; gap:8px; align-items:center; font-size:.8rem; font-weight:800; }
    .leader-bar { height:8px; border-radius:99px; background:#f7e7ef; overflow:hidden; }
    .leader-bar i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--pink),var(--plum)); }
    .leader-points { text-align:right; color:var(--pink-dark); font-weight:900; font-size:.82rem; }
    .day-log { display:grid; gap:8px; margin-top:14px; }
    .log-row { display:flex; justify-content:space-between; gap:12px; padding:10px 12px; background:#fff9fb; border-radius:12px; font-size:.78rem; }
    .log-row span:last-child { color:var(--muted); text-align:right; }
    .footer-note { text-align:center; margin-top:24px; color:#8b778a; font-size:.75rem; }
    .snow { position:fixed; pointer-events:none; opacity:.5; font-size:18px; z-index:-1; }
    .snow.one { top:12%; left:5%; } .snow.two { top:25%; right:7%; font-size:25px; } .snow.three { bottom:10%; left:9%; font-size:22px; }
    @media (max-width:850px) {
      .task-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .analytics-grid { grid-template-columns:1fr; }
      .summary-right { display:none; }
    }
    @media (max-width:560px) {
      .people-manager-row { grid-template-columns:minmax(100px,1fr) 42px auto; }
      .people-manager-row .member-remove { grid-column:1 / -1; justify-self:end; }
      .people-add-form { grid-template-columns:minmax(100px,1fr) 42px auto; }
      .people-manager, .anti-card { padding:14px 12px; }
      .app { width:min(100% - 22px,1240px); padding-top:19px; }
      .topline { align-items:flex-start; flex-direction:column; gap:8px; }
      h1 { font-size:2.2rem; line-height:.98; }
      .subtitle { margin:8px 0 17px; font-size:.86rem; }
      .toolbar { gap:7px; }
      .pill, .target-control { padding:8px 10px; font-size:.75rem; }
      .profile-tabs { margin-right:-11px; }
      .nav-tab { padding:8px 11px 8px 8px; }
      .modebar { width:100%; gap:2px; }
      .mode-tab { flex:1; min-width:0; padding:10px 6px; font-size:.72rem; white-space:nowrap; }
      .summary { padding:16px; gap:13px; }
      .ring { width:64px; height:64px; flex-basis:64px; }
      .summary h2 { font-size:.94rem; }
      .summary p { font-size:.75rem; }
      .calendar-panel { padding:14px 12px; }
      .calendar-top { align-items:flex-start; }
      .calendar-title h2 { font-size:.95rem; }
      .calendar-nav { width:31px; height:31px; }
      .today-button { padding:7px 9px; }
      .calendar-grid { gap:3px; }
      .day-cell { min-height:53px; padding:6px 5px; border-radius:9px; }
      .day-number { font-size:.75rem; }
      .day-meta { margin-top:6px; gap:3px; }
      .weekday { font-size:.6rem; }
      .day-count { font-size:.55rem; }
      .selected-day { align-items:flex-start; flex-direction:column; }
      .task-grid { grid-template-columns:1fr; gap:9px; }
      .task-card { min-height:auto; }
      .common-task { grid-template-columns:1fr; gap:7px; }
      .metrics { gap:8px; }

        const pastMonth=calendarMonth<=new Date(1900,0,1);
        const futureMonth=calendarMonth>=maxMonth;
        return `<section class="panel calendar-panel"><div class="calendar-top"><div class="calendar-title"><span class="month-sprig">🎄</span><div><h2>${esc(monthName(calendarMonth))}</h2><span style="color:var(--muted);font-size:.75rem">Нажмите на день, чтобы посмотреть или заполнить задачи</span></div></div><div class="calendar-actions"><button class="today-button" type="button" data-action="today">Сегодня</button><button class="calendar-nav" type="button" data-action="prev-month" aria-label="Предыдущий месяц" ${pastMonth?'disabled':''}>‹</button><button class="calendar-nav" type="button" data-action="next-month" aria-label="Следующий месяц" ${futureMonth?'disabled':''}>›</button></div></div><div class="calendar-grid">${weekdays.map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div><div class="selected-day"><div class="selected-day-label"><strong>📅 ${esc(formatLong(selectedDate))}</strong><span>${selectedDate===today?'Сегодня':selectedDate<today?'Прошедший день · отметки можно добавить или исправить':'Будущие даты пока недоступны'}</span></div><span>${totals(activeTab,selectedDate).count} выполнено · ${totals(activeTab,selectedDate).points} баллов</span></div></section>`;
      }
      function getCategories(owner) {
        if (!Array.isArray(state.categories?.[owner])) state.categories[owner]=[];
        for (const task of state.tasks[owner]||[]) if (!state.categories[owner].includes(task.category)) state.categories[owner].push(task.category);
        return state.categories[owner];
      }
      function categoryGroups(tasks,owner) { return getCategories(owner).map(category=>[category,tasks.filter(t=>t.category===category)]); }
      function taskRow(task,personId,day,owner=personId) {
        const done=isDone(day,personId,task.id);
        return `<label class="task-row ${done?'done':''}"><input type="checkbox" data-task="${esc(task.id)}" data-person="${personId}" data-date="${day}" ${done?'checked':''} aria-label="${done?'Снять отметку':'Отметить'}: ${esc(task.title)}"><span class="task-title">${esc(task.title)}</span><span class="task-points">+${task.points}</span><button type="button" class="remove-task" data-action="remove-task" data-owner="${owner}" data-task-id="${esc(task.id)}" aria-label="Удалить задачу ${esc(task.title)}">×</button></label>`;
      }
      function addTaskButton(owner,category) { return `<button class="add-task" type="button" data-action="add-task" data-owner="${owner}" data-category="${encodeURIComponent(category||'Личное')}">＋ Добавить задачу</button>`; }
      function blockControls(owner,category) {
        const encoded=encodeURIComponent(category);
        return `<span class="category-actions"><button class="block-action" type="button" data-action="rename-category" data-owner="${owner}" data-category="${encoded}" aria-label="Переименовать блок ${esc(category)}" title="Переименовать блок">✎</button><button class="block-action" type="button" data-action="remove-category" data-owner="${owner}" data-category="${encoded}" aria-label="Удалить блок ${esc(category)}" title="Удалить блок">×</button></span>`;
      }
      function taskCard(category,tasks,owner,personId,day,index) {
        const ownerTasks=tasks.filter(t=>t.category===category);
        return `<article class="panel task-card" style="--card-color:${palette[index%palette.length]}"><div class="task-card-head"><h3>${esc(category)}</h3>${blockControls(owner,category)}</div>${ownerTasks.length?`<div class="task-list">${ownerTasks.map(t=>taskRow(t,personId,day,owner)).join('')}</div>`:'<div class="empty-category">В этом блоке пока нет задач</div>'}${addTaskButton(owner,category)}<div class="form-slot" data-form-slot="${owner}:${encodeURIComponent(category)}"></div></article>`;
      }
      function renderAntiProcrastination(personId,day) {
        const entries = state.procrastination?.[day]?.[personId] || [];
        const hasEntry = entries.length > 0;
        // A single anti-procrastination win is allowed per participant per calendar day.
        // Older data with more than one entry is preserved and shown inline, never as a list.
        const entryText = entries.map(entry => entry.text).filter(Boolean).join(' · ');
        const earned = entries.reduce((sum, entry) => sum + (Number(entry.points) || 2), 0);
        return `<section class="panel anti-card">
          <h2>⏳ Анти-прокрастинация</h2>
          ${hasEntry
            ? `<p class="anti-result">Сегодня ты наконец сделала: <strong>${esc(entryText)}</strong>. Это ещё <strong>+${earned} балла</strong> к твоему прогрессу!</p><button type="button" class="anti-remove" data-action="remove-procrastination" data-person="${esc(personId)}" data-date="${day}">Убрать запись</button>`
            : `<p class="anti-copy">Какое дело ты давно откладывала, но сегодня всё-таки сделала? Запиши одну маленькую победу и получи <strong>+2 балла</strong>.</p><form class="anti-form" data-procrastination-form data-person="${esc(personId)}" data-date="${day}"><input name="text" required maxlength="180" placeholder="Например: наконец разобрала рабочий стол" aria-label="Дело, которое ты давно откладывала"><button class="small-action" type="submit">Готово · +2 балла</button></form><div class="anti-hint">Одна запись в день — выбери самое важное дело 💛</div>`}
        </section>`;
      }
      function renderPersonTasks(personId,day) {
        const tasks=state.tasks[personId]||[];
        const groups=categoryGroups(tasks,personId);
        return `<section class="task-section"><div class="section-head"><div><h2>🌷 Личные задачи</h2><p>Здесь отмечаются только задачи этой участницы</p></div><button class="outline-action" type="button" data-action="add-category" data-owner="${personId}">＋ Добавить блок</button></div>${groups.length?`<div class="task-grid">${groups.map(([category],i)=>taskCard(category,tasks,personId,personId,day,i)).join('')}</div>`:'<div class="panel empty-state"><strong>Пока здесь нет личных блоков</strong><br>Добавьте блок, чтобы собрать свои задачи.</div>'}</section>`;
      }
      function renderCommonTasks(day) {
        const tasks=state.tasks.common;
        const person=selectedPerson();
        const groups=categoryGroups(tasks,'common');
        return `<section class="task-section"><div class="section-head"><div><h2>🤍 Общие задачи</h2><p>Этот список общий для всех; отметки и баллы учитываются отдельно для ${person.name}</p></div><button class="outline-action" type="button" data-action="add-category" data-owner="common">＋ Добавить блок</button></div>${groups.length?`<div class="task-grid">${groups.map(([category],i)=>taskCard(category,tasks,'common',person.id,day,i)).join('')}</div>`:'<div class="panel empty-state"><strong>Пока нет общих блоков</strong><br>Добавьте блок, чтобы создать общий список задач.</div>'}</section>`;
      }
      function renderPeopleManager() {
        const panel = document.getElementById('people-manager');
        const button = document.getElementById('manage-people-button');
        if (!panel || !button) return;
        panel.hidden = !peopleManagerOpen;
        button.setAttribute('aria-expanded', String(peopleManagerOpen));
        if (!peopleManagerOpen) return;
        const nextColor = palette[people.length % palette.length] || '#e873a0';
        panel.innerHTML = `<h2>Управление участницами</h2><p>Можно изменить имя и цвет профиля или добавить новую участницу. Удаление участницы также удаляет её личные задачи и историю отметок.</p><div class="people-manager-list">${people.map(person=>`<form class="people-manager-row" data-member-form="${esc(person.id)}"><input type="text" name="name" maxlength="32" required value="${esc(person.name)}" aria-label="Имя участницы"><input type="color" name="color" value="${esc(person.color)}" aria-label="Цвет участницы"><button class="small-action" type="submit">Сохранить</button><button class="small-action secondary member-remove" type="button" data-action="remove-person" data-person="${esc(person.id)}">Удалить</button></form>`).join('')}</div><form class="people-add-form" data-add-person-form><input type="text" name="name" maxlength="32" required placeholder="Имя новой участницы"><input type="color" name="color" value="${nextColor}" aria-label="Цвет новой участницы"><button class="small-action" type="submit">＋ Добавить</button></form>`;
      }
      function getRangeKeys(personId) {
        const now=fromKey(today), result=[];
        if(range==='7') { for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);result.push(dateKey(d));} }
        else if(range==='month') { for(let i=1;i<=now.getDate();i++)result.push(dateKey(new Date(now.getFullYear(),now.getMonth(),i))); }
        else { const keys=new Set([today,...Object.keys(state.completions)]); return [...keys].sort(); }
        return result;
      }
      function getPersonPointsOn(personId,day) { return totals(personId,day).points; }
      function getAnalyticsDaily(personIds) {
        const endDate = fromKey(today);
        let startDate;
        if (range === '7') {
          startDate = new Date(endDate);
          startDate.setDate(startDate.getDate() - 6);
        } else if (range === 'month') {
          startDate = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
        } else {
          const allRecordedDates = new Set([
            ...Object.keys(state.completions || {}),
            ...Object.keys(state.procrastination || {})
          ]);
          const validDates = [...allRecordedDates]
            .filter(key => /^\d{4}-\d{2}-\d{2}$/.test(key))
            .sort();
          startDate = validDates.length ? fromKey(validDates[0]) : new Date(endDate);
          if (!validDates.length) startDate.setDate(startDate.getDate() - 6);
        }

        // Include every calendar day, including days without activity (zero points).
        const daily = [];
        for (const cursor = new Date(startDate); cursor <= endDate; cursor.setDate(cursor.getDate() + 1)) {
          const date = dateKey(cursor);
          const points = personIds.reduce((sum, personId) => sum + totals(personId, date).points, 0);
          const actions = personIds.reduce((sum, personId) => sum + totals(personId, date).count, 0);
          daily.push({ date, points, actions });
        }
        return daily;
      }

      function renderLineChart(daily, heading, description, accent, ariaLabel) {
        const totalPoints = daily.reduce((sum, day) => sum + day.points, 0);
        const peak = Math.max(0, ...daily.map(day => day.points));
        const maxY = Math.max(4, Math.ceil(peak / 4) * 4);
        const width = 760, height = 300;
        const left = 48, right = 18, top = 18, bottom = 48;
        const plotWidth = width - left - right;
        const plotHeight = height - top - bottom;
        const baseY = top + plotHeight;
        const points = daily.map((day, index) => ({
          x: left + (daily.length <= 1 ? plotWidth / 2 : index * plotWidth / (daily.length - 1)),
          y: baseY - (day.points / maxY) * plotHeight,
          ...day
        }));

        // Use only straight L segments: no cubic/quadratic smoothing.
        const linePath = points.length
          ? points.map((point, index) => `${index ? 'L' : 'M'} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(' ')
          : '';
        const areaPath = points.length
          ? `${linePath} L ${points[points.length - 1].x.toFixed(1)} ${baseY} L ${points[0].x.toFixed(1)} ${baseY} Z`
          : '';

        const grid = Array.from({ length: 5 }, (_, index) => {
          const value = maxY - (maxY * index / 4);
          const y = top + plotHeight * index / 4;
          return `<g><line class="team-chart-grid" x1="${left}" y1="${y.toFixed(1)}" x2="${width-right}" y2="${y.toFixed(1)}"/><text x="${left-10}" y="${(y+4).toFixed(1)}" text-anchor="end">${Math.round(value)}</text></g>`;
        }).join('');

        const tickIndexes = [...new Set([
          0,
          Math.round((daily.length - 1) * .25),
          Math.round((daily.length - 1) * .5),
          Math.round((daily.length - 1) * .75),
          daily.length - 1
        ])].filter(index => index >= 0 && index < daily.length);
        const xLabels = tickIndexes.map(index => {
          const point = points[index];
          const label = fromKey(point.date).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
          return `<text x="${point.x.toFixed(1)}" y="${height-15}" text-anchor="middle">${label}</text>`;
        }).join('');
        const dots = points.map(point =>
          `<circle class="team-chart-point" cx="${point.x.toFixed(1)}" cy="${point.y.toFixed(1)}" r="3" style="stroke:${accent}"><title>${esc(formatLong(point.date))}: ${point.points} баллов · ${point.actions} действий</title></circle>`
        ).join('');
        const safeAccent = /^#[0-9a-f]{6}$/i.test(accent) ? accent : '#df4a83';

        return `<article class="panel team-chart-card">
          <div class="team-chart-heading"><div><h3>${esc(heading)}</h3><p>${esc(description)}</p></div><div class="team-chart-total">${totalPoints} баллов за период</div></div>
          ${points.length ? `<div class="team-chart-wrap"><svg class="team-chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(ariaLabel)}">${grid}<defs><linearGradient id="analyticsLineFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${safeAccent}" stop-opacity=".20"/><stop offset="100%" stop-color="${safeAccent}" stop-opacity=".015"/></linearGradient></defs><path d="${areaPath}" fill="url(#analyticsLineFill)"/><path class="team-chart-line" d="${linePath}" style="stroke:${safeAccent}"/>${dots}${xLabels}</svg></div>` : '<div class="team-chart-empty">Пока нет данных для графика. Отметьте первые задачи — здесь появится динамика.</div>'}
        </article>`;
      }

      function renderPersonalAnalytics() {
        const person = selectedPerson();
        const daily = getAnalyticsDaily([person.id]);
        const totalPoints = daily.reduce((sum, day) => sum + day.points, 0);
        const totalActions = daily.reduce((sum, day) => sum + day.actions, 0);
        const activeDaily = daily.filter(day => day.actions > 0);
        const activeDays = activeDaily.length;
        const antiWins = daily.reduce((sum, day) => sum + (state.procrastination?.[day.date]?.[person.id] || []).length, 0);
        const streak = streaks(person.id);
        const average = activeDays ? Math.round(totalPoints / activeDays * 10) / 10 : 0;
        const bestDay = daily.reduce((best, day) => day.points > (best?.points ?? -1) ? day : best, null);

        // Breakdown of earned points by task category, including anti-procrastination entries.
        const categoryTotals = new Map();
        for (const day of daily) {
          const dayTotals = totals(person.id, day.date);
          for (const task of dayTotals.doneTasks) {
            categoryTotals.set(task.category, (categoryTotals.get(task.category) || 0) + (Number(task.points) || 0));
          }
          const antiPoints = (dayTotals.antiEntries || []).reduce((sum, entry) => sum + (Number(entry.points) || 2), 0);
          if (antiPoints) categoryTotals.set('⏳ Анти-прокрастинация', (categoryTotals.get('⏳ Анти-прокрастинация') || 0) + antiPoints);
        }
        const categoryRows = [...categoryTotals.entries()].sort((a,b) => b[1]-a[1]);
        const maxCategory = Math.max(1, ...categoryRows.map(([,value]) => value));
        const categoryMarkup = categoryRows.length
          ? `<div class="category-list">${categoryRows.map(([name,value]) => `<div class="category-line"><span class="category-name">${esc(name)}</span><span class="category-track"><i class="category-fill" style="display:block;width:${value/maxCategory*100}%"></i></span><span class="category-value">${value}</span></div>`).join('')}</div>`
          : '<div class="empty-state">В выбранном периоде пока нет выполненных задач.</div>';

        const recentDays = activeDaily.slice(-10).reverse();
        const dayLog = recentDays.length
          ? `<div class="day-log">${recentDays.map(day => `<div class="log-row"><span>${esc(formatLong(day.date))}</span><span>${day.points} баллов · ${day.actions} действий</span></div>`).join('')}</div>`
          : '<div class="empty-state">Отметь первую задачу — здесь появится история активности.</div>';

        return `<section class="section-head"><div><h2>👤 Личная аналитика · ${esc(person.name)}</h2><p>Подробная динамика, активность и вклад категорий выбранной участницы</p></div></section>
          <div class="range-switch">${[['7','7 дней'],['month','Этот месяц'],['all','Всё время']].map(([id,label])=>`<button class="range-button ${range===id?'active':''}" data-range="${id}" type="button">${label}</button>`).join('')}</div>
          <div class="metrics personal-metrics">
            <article class="panel metric"><strong style="color:${esc(person.color)}">${totalPoints}</strong><span>всего баллов</span></article>
            <article class="panel metric"><strong style="color:${esc(person.color)}">${totalActions}</strong><span>выполнено действий</span></article>
            <article class="panel metric"><strong style="color:${esc(person.color)}">${activeDays}</strong><span>активных дней</span></article>
            <article class="panel metric"><strong style="color:${esc(person.color)}">${average}</strong><span>баллов в активный день</span></article>
            <article class="panel metric"><strong style="color:${esc(person.color)}">${streak.current} 🔥</strong><span>текущая серия · рекорд ${streak.best}</span></article>
            <article class="panel metric"><strong style="color:${esc(person.color)}">${bestDay && bestDay.points > 0 ? bestDay.points : 0}</strong><span>лучший день${bestDay && bestDay.points > 0 ? ` · ${fromKey(bestDay.date).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}` : ''}</span></article>
          </div>
          ${renderLineChart(daily, `Динамика · ${person.name}`, 'Баллы за каждый календарный день', person.color, `Личная динамика ${person.name} по дням`)}
          <div class="analytics-grid" style="margin-top:14px">
            <article class="panel chart-panel"><h3>🏷️ Баллы по категориям</h3><p>Какие направления дали больше всего баллов за период</p>${categoryMarkup}</article>
            <article class="panel chart-panel"><h3>📅 История активности</h3><p>Последние активные дни выбранного периода</p>${dayLog}</article>
          </div>
          <p class="analytics-footnote">Анти-прокрастинация: ${antiWins} небольших побед · ${antiWins * 2} баллов за выбранный период.</p>`;
      }

      function renderTeamAnalytics() {
        const personIds = people.map(person => person.id);
        const daily = getAnalyticsDaily(personIds);
        const totalPoints = daily.reduce((sum, day) => sum + day.points, 0);
        const activeDays = daily.filter(day => day.actions > 0).length;
        const antiWins = daily.reduce((sum, day) => sum + personIds.reduce((count, personId) =>
          count + (state.procrastination?.[day.date]?.[personId] || []).length, 0), 0);

        return `<section class="section-head"><div><h2>👥 Общая аналитика команды</h2><p>Суммарный прогресс всех ${people.length} участниц</p></div></section>
          <div class="range-switch">${[['7','7 дней'],['month','Этот месяц'],['all','Всё время']].map(([id,label])=>`<button class="range-button ${range===id?'active':''}" data-range="${id}" type="button">${label}</button>`).join('')}</div>
          ${renderLineChart(daily, 'Динамика команды', 'Сумма баллов всех участниц за каждый календарный день', '#df4a83', `График суммарных баллов всех ${people.length} участниц по дням`)}
          <p class="analytics-footnote">За период команда набрала ${totalPoints} баллов и была активна ${activeDays} дней. Анти-прокрастинация: ${antiWins} небольших побед · по 2 балла за каждую.</p>`;
      }
      function render() {
        renderHero(); renderTabs(); renderPeopleManager();
        document.querySelectorAll('.mode-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===activeMode));
        const main=document.getElementById('main-content');
        if(activeMode==='personal-progress') { main.innerHTML=renderPersonalAnalytics(); return; }
        if(activeMode==='team-progress') { main.innerHTML=renderTeamAnalytics(); return; }
        let body=renderSummary();
        body+=renderCommonTasks(selectedDate)+renderAntiProcrastination(activeTab,selectedDate)+renderPersonTasks(activeTab,selectedDate)+renderCalendar();
        main.innerHTML=body;
      }
      function showAddForm(owner,category) {
        const key=`${owner}:${encodeURIComponent(category)}`;
        const slot=document.querySelector(`[data-form-slot="${CSS.escape(key)}"]`);
        if(!slot) return;
        const existing=slot.innerHTML.trim();
        if(existing) { slot.innerHTML=''; return; }
        slot.innerHTML=`<form class="inline-form" data-add-form data-owner="${owner}" data-category="${esc(category)}"><input name="title" required maxlength="100" placeholder="Название задачи" aria-label="Название задачи"><input class="points-input" name="points" type="number" min="1" max="50" value="1" aria-label="Баллы"><button class="small-action" type="submit">Добавить</button><button class="small-action secondary" type="button" data-action="cancel-form">Отмена</button></form>`;
        slot.querySelector('input[name=title]')?.focus();
      }
      document.addEventListener('click',e=>{
        if(e.target.closest('#manage-people-button')) { peopleManagerOpen=!peopleManagerOpen; renderPeopleManager(); return; }
        const tab=e.target.closest('[data-tab]');
        if(tab){activeTab=tab.dataset.tab;render();return;}
        const mode=e.target.closest('[data-mode]');
        if(mode){activeMode=mode.dataset.mode;render();return;}
        const date=e.target.closest('.day-cell[data-date]');
        if(date){selectedDate=date.dataset.date;calendarMonth=new Date(fromKey(selectedDate).getFullYear(),fromKey(selectedDate).getMonth(),1);render();return;}
        const rangeButton=e.target.closest('[data-range]');
        if(rangeButton){range=rangeButton.dataset.range;render();return;}
        const action=e.target.closest('[data-action]');
        if(!action)return;
        if(action.dataset.action==='today'){selectedDate=today;calendarMonth=new Date(fromKey(today).getFullYear(),fromKey(today).getMonth(),1);render();return;}
        if(action.dataset.action==='prev-month'){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);render();return;}
        if(action.dataset.action==='next-month'){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);render();return;}
        if(action.dataset.action==='remove-procrastination'){
          const personId=action.dataset.person, date=action.dataset.date;
          const entries=state.procrastination?.[date]?.[personId]||[];
          if(!entries.length) return;
          const points=entries.reduce((sum,entry)=>sum+(Number(entry.points)||2),0);
          if(!window.confirm(`Убрать эту победу и снять ${points} балла${points===2?'':'ов'}?`)) return;
          delete state.procrastination[date][personId];
          if(!Object.keys(state.procrastination[date]).length) delete state.procrastination[date];
          save();render();return;
        }
        if(action.dataset.action==='remove-person'){
          const personId=action.dataset.person;
          const person=people.find(item=>item.id===personId);
          if(!person) return;
          if(people.length<=1){window.alert('В трекере должна остаться хотя бы одна участница.');return;}
          if(!window.confirm(`Удалить участницу «${person.name}»? Её личные задачи, отметки и записи анти-прокрастинации будут удалены без возможности восстановления.`)) return;
          people=people.filter(item=>item.id!==personId); tabs=people; state.people=people;
          delete state.tasks[personId]; delete state.categories[personId];
          for(const date of Object.keys(state.completions)){ if(state.completions[date]) delete state.completions[date][personId]; if(!Object.keys(state.completions[date]||{}).length) delete state.completions[date]; }
          for(const date of Object.keys(state.procrastination)){ if(state.procrastination[date]) delete state.procrastination[date][personId]; if(!Object.keys(state.procrastination[date]||{}).length) delete state.procrastination[date]; }
          if(activeTab===personId) activeTab=people[0].id;
          save();render();return;
        }
        if(action.dataset.action==='add-category'){
          const owner=action.dataset.owner;
          const name=window.prompt('Название нового блока задач:');
          if(name===null)return;
          const category=name.trim();
          if(!category){window.alert('Введите название блока.');return;}
          if(getCategories(owner).some(item=>item.toLocaleLowerCase()===category.toLocaleLowerCase())){window.alert('Блок с таким названием уже есть.');return;}
          state.categories[owner].push(category);save();render();return;
        }
        if(action.dataset.action==='rename-category'){
          const owner=action.dataset.owner, oldName=decodeURIComponent(action.dataset.category);
          const newName=window.prompt('Новое название блока:',oldName);
          if(newName===null)return;
          const category=newName.trim();
          if(!category){window.alert('Название блока не может быть пустым.');return;}
          if(category!==oldName && getCategories(owner).some(item=>item.toLocaleLowerCase()===category.toLocaleLowerCase())){window.alert('Блок с таким названием уже есть.');return;}
          state.categories[owner]=getCategories(owner).map(item=>item===oldName?category:item);
          for(const task of state.tasks[owner]||[]) if(task.category===oldName) task.category=category;
          save();render();return;
        }
        if(action.dataset.action==='remove-category'){
          const owner=action.dataset.owner, category=decodeURIComponent(action.dataset.category);
          const removed=(state.tasks[owner]||[]).filter(task=>task.category===category);
          if(!window.confirm(`Удалить блок «${category}»${removed.length?` и ${removed.length} задач`:''}? Отметки этих задач за прошлые дни тоже будут удалены.`))return;
          const removedIds=new Set(removed.map(task=>task.id));
          state.tasks[owner]=(state.tasks[owner]||[]).filter(task=>task.category!==category);
          state.categories[owner]=getCategories(owner).filter(item=>item!==category);
          for(const day of Object.keys(state.completions)){
            const owners=owner==='common'?people.map(p=>p.id):[owner];
            for(const personId of owners) if(state.completions[day]?.[personId]) state.completions[day][personId]=state.completions[day][personId].filter(id=>!removedIds.has(id));
          }
          save();render();return;
        }
        if(action.dataset.action==='add-task'){showAddForm(action.dataset.owner,decodeURIComponent(action.dataset.category));return;}
        if(action.dataset.action==='cancel-form'){action.closest('.form-slot').innerHTML='';return;}
        if(action.dataset.action==='remove-task'){
          const owner=action.dataset.owner, id=action.dataset.taskId;
          const list=state.tasks[owner]||[]; state.tasks[owner]=list.filter(t=>t.id!==id);
          for(const d of Object.keys(state.completions)) for(const p of Object.keys(state.completions[d])) state.completions[d][p]=(state.completions[d][p]||[]).filter(x=>x!==id);
          save();render();
        }
      });
      document.addEventListener('change',e=>{
        if(e.target.id==='daily-target'){state.target=Math.min(500,Math.max(1,Number(e.target.value)||20));save();render();return;}
        if(e.target.matches('input[type=checkbox][data-task]')){toggleTask(e.target.dataset.date,e.target.dataset.person,e.target.dataset.task);}
      });
      document.addEventListener('submit',e=>{
        const memberForm=e.target.closest('[data-member-form]');
        if(memberForm){
          e.preventDefault();
          const person=people.find(item=>item.id===memberForm.dataset.memberForm);
          const fd=new FormData(memberForm), name=String(fd.get('name')||'').trim(), color=String(fd.get('color')||'');
          if(!person||!name) return;
          person.name=name; person.avatar=Array.from(name)[0]||'•'; person.color=/^#[0-9a-f]{6}$/i.test(color)?color:person.color;
          state.people=people; save(); render(); return;
        }
        const addPersonForm=e.target.closest('[data-add-person-form]');
        if(addPersonForm){
          e.preventDefault();
          const fd=new FormData(addPersonForm), name=String(fd.get('name')||'').trim(), color=String(fd.get('color')||palette[people.length%palette.length]||'#e873a0');
          if(!name) return;
          const id=`member-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`;
          const person={id,name,avatar:Array.from(name)[0]||'•',color:/^#[0-9a-f]{6}$/i.test(color)?color:'#e873a0'};
          people.push(person); tabs=people; state.people=people; state.tasks[id]=[]; state.categories[id]=[];
          activeTab=id; save(); render(); return;
        }
        const antiForm=e.target.closest('[data-procrastination-form]');
        if(antiForm){
          e.preventDefault();
          const fd=new FormData(antiForm), textValue=String(fd.get('text')||'').trim();
          const personId=antiForm.dataset.person, day=antiForm.dataset.date;
          if(!textValue||!people.some(person=>person.id===personId)||day>today) return;
          if(!state.procrastination[day]) state.procrastination[day]={};
          if(!Array.isArray(state.procrastination[day][personId])) state.procrastination[day][personId]=[];
          if(state.procrastination[day][personId].length){window.alert('На этот день уже записана одна победа. Можно убрать её и добавить другую.');return;}
          state.procrastination[day][personId].push({id:`anti-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`,text:textValue,points:2});
          save(); render(); return;
        }
        const form=e.target.closest('[data-add-form]'); if(!form)return; e.preventDefault();
        const fd=new FormData(form), title=String(fd.get('title')||'').trim(), points=Math.min(50,Math.max(1,Number(fd.get('points'))||1));
        if(!title)return;
        const owner=form.dataset.owner, category=form.dataset.category;
        const id=`task-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
        state.tasks[owner].push({id,category,title,points}); getCategories(owner); save(); render();
      });
      document.getElementById('today-button-top').addEventListener('click',()=>{selectedDate=today;calendarMonth=new Date(fromKey(today).getFullYear(),fromKey(today).getMonth(),1);render();});
      render();
      connectCloud();
    })();
  </script>
</body>
</html>
